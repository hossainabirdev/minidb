[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-db"
version = "1.1.0"
description = "A tiny database engine built from scratch in Python"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Abir Hossain" },
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/hossainabirdev/mini-db"
Repository = "https://github.com/hossainabirdev/mini-db"

[tool.setuptools.packages.find]
include = ["minidb*"]
